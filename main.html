<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table style="width: 100%; height: 100%">
	    <!-- Your code here -->
		<tr>
	        <!-- Left Top -->
	        <td width="50%">
	            <table border="1" cellspacing="0" cellpadding="5" width="100%">
	                <tr>
	                    <th colspan="2">Nested Table 2</th>
	                </tr>
	                <tr>
	                    <th>Column 1</th>
	                    <th>Column 2</th>
	                </tr>
	                <tr>
	                    <td align="center">abc</td>
	                    <td align="center">def</td>
	                </tr>
	            </table>
	        </td>
	
	        <!-- Right Top -->
	        <td width="50%">
	            <table border="1" cellspacing="0" cellpadding="5" width="100%">
	                <tr>
	                    <th>Nested Table 1</th>
	                </tr>
	                <tr>
	                    <td>
	                        <ul>
	                            <li>List item 1</li>
	                            <li>List item 2</li>
	                            <li>List item 3</li>
	                        </ul>
	                    </td>
	                </tr>
	            </table>
	        </td>
	    </tr>
	
	    <tr>
	        <!-- Left Bottom -->
	        <td>
	            <table border="1" cellspacing="0" cellpadding="5" width="100%">
	                <tr>
	                    <th colspan="2">Nested Table 3</th>
	                </tr>
	                <tr>
	                    <td>
	                        <a href="#">Nested Table</a>
	                    </td>
	                    <td>Demo Continued</td>
	                </tr>
	            </table>
	        </td>
	
	        <!-- Right Bottom -->
	        <td>
	            <table border="1" cellspacing="0" cellpadding="5" width="100%">
	                <tr>
	                    <th>Nested Table 4</th>
	                </tr>
	                <tr>
	                    <td align="center" bgcolor="black">
	                        <font color="white">HTML</font>
	                    </td>
	                </tr>
	            </table>
	        </td>
	    </tr>
    </table>
  </body>
</html>
